<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — $author_names</title>
<meta name="description" content="$description">
<meta name="author" content="$author_names">
<link rel="canonical" href="$canonical">
$citation_meta
<meta property="og:type" content="article">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$canonical">
<meta property="og:image" content="https://bwuebben.github.io/assets/social-card.jpg">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">$structured_data</script>
<!-- site:styles -->
<!-- /site:styles -->
<link rel="stylesheet" href="../../assets/paper.css?v=$paper_css_version">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>∑</text></svg>">
</head>
<body>
<!-- Generated by tools/update-papers.py from data/papers.json. -->
<!-- site:navigation -->
<!-- /site:navigation -->
<main id="main" class="wrap paper-page" tabindex="-1">
  <a class="paper-back" href="../#$catalogue_anchor">← All papers</a>
  <article>
    <header>
      <p class="paper-series-label">$label</p>
      <h1 class="citation_title">$title</h1>
      <p class="paper-author">$authors</p>
      <p class="paper-dates">$dates</p>
      <div class="paper-actions">$read_link</div>
    </header>
    <section class="paper-abstract" aria-labelledby="abstract">
      <h2 id="abstract">Abstract</h2>
      $abstract_html
    </section>
$status_note
    <section class="paper-resources" aria-labelledby="files-and-archive">
      <h2 id="files-and-archive">Files and archive</h2>
      <ul class="paper-links">
$resources
      </ul>
    </section>
    <section class="paper-citation" aria-labelledby="cite-this-paper">
      <h2 id="cite-this-paper">Cite this paper</h2>
      <p>$author_names. <cite>$title.</cite> $citation_status, $year. $citation_link.</p>
      <a class="paper-bibtex" href="citation.bib" download>Download BibTeX</a>
    </section>
    <p class="paper-related">$related</p>
  </article>
</main>
</body>
</html>
