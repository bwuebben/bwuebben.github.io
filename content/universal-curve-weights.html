<figure class="curve-weights">
  <svg viewBox="0 0 400 238" role="img" aria-labelledby="curve-weights-title curve-weights-desc">
    <title id="curve-weights-title">Two circle actions on the normal plane</title>
    <desc id="curve-weights-desc">The horizontal and vertical coordinates are the weights on the two normal lines. The scalar action has weights (1, 1). Reflecting the second weight gives the antidiagonal action (1, −1).</desc>
    <g fill="none" stroke="var(--rule)">
      <path d="M35 41H202 M35 195H202 M42 19V217 M196 19V217"/>
    </g>
    <g fill="none" stroke="var(--ink-soft)" stroke-width="1.25">
      <path d="M35 118H365m-5-3 5 3-5 3 M119 216V15m-3 5 3-5 3 5"/>
    </g>
    <g fill="var(--ink-soft)" font-size="16" font-style="italic">
      <text x="369" y="123">a</text><text x="129" y="22">b</text>
      <text x="103" y="136" font-style="normal" font-size="14">0</text>
    </g>
    <g fill="none" stroke-width="2.5">
      <path d="M119 118L196 41" stroke="var(--ink-soft)"/>
      <path d="M119 118L196 195" stroke="var(--accent)"/>
    </g>
    <circle cx="119" cy="118" r="3" fill="var(--ink)"/>
    <circle cx="196" cy="41" r="4.5" fill="var(--ink-soft)"/>
    <circle cx="196" cy="195" r="4.5" fill="var(--accent)"/>
    <g font-size="20">
      <text x="210" y="34" fill="var(--ink)">Scalar</text>
      <text x="210" y="62" fill="var(--ink-soft)" font-size="16">(1, 1)</text>
      <text x="210" y="188" fill="var(--accent)">Antidiagonal</text>
      <text x="210" y="216" fill="var(--ink-soft)" font-size="16">(1, −1)</text>
    </g>
  </svg>
  <figcaption>The weights <i>a</i> and <i>b</i> tell how the circle rotates the two normal lines. The holomorphic volume form has weight <i>a</i> + <i>b</i>, which vanishes on the antidiagonal.</figcaption>
</figure>
