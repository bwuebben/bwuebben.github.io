<figure class="conifold-plate" id="conifold-transition-figure" aria-labelledby="cycle-legend">
  <fieldset class="cycle-controls">
    <legend id="cycle-legend">The conifold transition</legend>
    <div class="cycle-choices">
      <label><input type="radio" name="conifold-cycle" value="resolution">Resolution <i>S²</i></label>
      <label><input type="radio" name="conifold-cycle" value="node">Node</label>
      <label><input type="radio" name="conifold-cycle" value="smoothing" checked>Smoothing <i>S³</i></label>
    </div>
  </fieldset>
  <div class="cycle-art">
    <img class="cycle-smoothing" src="/assets/illustrations/conifold-cycle-smoothing.webp" width="1200" height="1200" fetchpriority="high" alt="Gold, copper and green circles sweep through one another in a stereographic view of Hopf fibres.">
    <img class="cycle-node" src="/assets/illustrations/conifold-cycle-node.webp" width="1200" height="1200" loading="lazy" alt="Two wire cones in gold and green meet at a single vertex.">
    <img class="cycle-resolution" src="/assets/illustrations/conifold-cycle-resolution.webp" width="1200" height="1200" loading="lazy" alt="A green two-sphere with a gold equator, marked with meridians and parallels.">
  </div>
  <figcaption aria-live="polite" aria-atomic="true">
    <span class="cycle-smoothing"><b>The vanishing three-sphere.</b> Each loop is a Hopf circle on <i>S³</i>. Stereographic projection lets us see in three dimensions how each pair links once.</span>
    <span class="cycle-node"><b>The singular point.</b> The two cones meet at the node. The drawing shows the real slice <i>x</i>² + <i>y</i>² = <i>z</i>² of the complex threefold.</span>
    <span class="cycle-resolution"><b>The exceptional curve.</b> A small resolution replaces the node by a complex projective line. Its underlying surface is the two-sphere <i>S²</i>.</span>
  </figcaption>
</figure>
