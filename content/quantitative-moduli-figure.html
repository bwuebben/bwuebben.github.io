<figure class="loss-figure" aria-labelledby="loss-title" aria-describedby="loss-caption">
  <p class="kicker">A finite spectral model</p>
  <h2 id="loss-title">How a new zero mode appears</h2>
  <div class="loss-states">
    <div class="loss-state">
      <p class="loss-state-title">Before the limit</p>
      <svg viewBox="0 0 240 180" role="img" aria-label="One connected graph: two strongly linked pairs joined by a weak bridge.">
        <g class="loss-pairs"><rect x="38" y="16" width="64" height="144" rx="30"/><rect x="138" y="16" width="64" height="144" rx="30"/></g>
        <path class="loss-strong" d="M70 45V130M170 45V130"/>
        <path class="loss-weak" d="M70 130H170"/>
        <g class="loss-nodes"><circle cx="70" cy="45" r="11"/><circle cx="70" cy="130" r="11"/><circle cx="170" cy="45" r="11"/><circle cx="170" cy="130" r="11"/></g>
      </svg>
      <p class="loss-weight">Bridge weight ε &gt; 0</p>
      <p class="loss-count">1 connected component<br><strong>1 zero mode</strong></p>
    </div>
    <div class="loss-state">
      <p class="loss-state-title">At the limit</p>
      <svg viewBox="0 0 240 180" role="img" aria-label="Two disconnected components: the bridge has vanished and each strong pair remains connected.">
        <g class="loss-pairs"><rect x="38" y="16" width="64" height="144" rx="30"/><rect x="138" y="16" width="64" height="144" rx="30"/></g>
        <path class="loss-strong" d="M70 45V130M170 45V130"/>
        <g class="loss-nodes"><circle cx="70" cy="45" r="11"/><circle cx="70" cy="130" r="11"/><circle cx="170" cy="45" r="11"/><circle cx="170" cy="130" r="11"/></g>
      </svg>
      <p class="loss-weight">Bridge weight ε = 0</p>
      <p class="loss-count">2 connected components<br><strong>2 zero modes</strong></p>
    </div>
  </div>
  <p class="loss-key"><span class="loss-key-line" aria-hidden="true"></span> Solid links have weight 1.</p>
  <figcaption id="loss-caption">For the weighted graph Laplacian, each connected component contributes one zero mode. As the bridge vanishes, one positive eigenvalue tends to zero; the other two stay away from zero.</figcaption>
  <p class="loss-scope">This illustrates one vanishing scale. The programme treats several scales and their relation to actual metrics and flows.</p>
</figure>
