<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>essay card source</title>
<!--
  Source for assets/social-card-essay.jpg — the 1200x630 link preview for
  /math-and-ai/. A text card: the essay is what is being shared, not the
  author. Regenerate with tools/render-card.sh.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
    background: #16161a; color: #e7e4de;
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
  }
  .eyebrow {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 20px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #d98a8a;
  }
  h1 {
    margin-top: 26px; max-width: 980px;
    font-size: 72px; line-height: 1.1; font-weight: 600; letter-spacing: -0.015em;
  }
  .sub { margin-top: 24px; max-width: 900px; font-size: 30px; line-height: 1.35; color: #a9a49b; }
  .rule { width: 62px; height: 2px; background: #d98a8a; margin: 36px 0 22px; }
  .by {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 20px; letter-spacing: 0.055em; text-transform: uppercase; color: #a9a49b;
  }
</style>
</head>
<body>
  <div class="eyebrow">Essay</div>
  <h1>When Mathematics Outgrows Its&nbsp;Gatekeepers</h1>
  <p class="sub">AI, mathematical discovery, and the expansion of human ambition</p>
  <div class="rule"></div>
  <p class="by">Bernd Johannes Wuebben · bwuebben.github.io</p>
</body>
</html>
